# ─────────────────────────────────────────────────────────────
# 금리·환율·섹터 모니터 설정 파일
# 티커/항목을 바꾸고 싶으면 여기만 고치면 됩니다.
# kind: rate(단위 %, 변화는 bp) / spread(단위 bp) / price(변화는 %)
# session: US = 미국 시간대 종가, KR = 한국 시간대 종가
#   → 세션이 다른 두 지표는 "한국 t일 ↔ 미국 t-1일"로 맞춰 상관·베타를 계산합니다.
# ─────────────────────────────────────────────────────────────

lookback_days: 540        # 수집 기간(달력일)
corr_short: 20            # 단기 상관 윈도우(거래일) ≈ 1개월
corr_long: 120            # 장기 상관 윈도우(거래일) ≈ 6개월
beta_window: 60           # 금리 베타 회귀 윈도우(거래일)
couple_threshold: 0.30    # |장기 상관| 이 이상이어야 '관계 있음'
scenario_bp: 20           # 시나리오 표: 미국 10년 ±20bp
history_points: 260       # 차트용으로 앱에 보내는 과거 데이터 개수

anthropic_model: claude-sonnet-5   # 뉴스 요약·전망용. 바꾸려면 여기만.

series:
  # ── 미국 금리 (FRED, 키 불필요, 하루 지연) ──
  US2Y:       {name: 미국 2년,        src: fred, id: DGS2,   kind: rate, session: US, group: us_rates}
  US10Y:      {name: 미국 10년,       src: fred, id: DGS10,  kind: rate, session: US, group: us_rates, live: "^TNX"}
  US30Y:      {name: 미국 30년,       src: fred, id: DGS30,  kind: rate, session: US, group: us_rates}
  US10Y_REAL: {name: 10년 실질금리,   src: fred, id: DFII10, kind: rate, session: US, group: us_rates}
  US10Y_BEI:  {name: 10년 기대인플레, src: fred, id: T10YIE, kind: rate, session: US, group: us_rates}
  US_MORT30:  {name: 30년 모기지금리, src: fred, id: MORTGAGE30US, kind: rate, session: US, group: us_rates}

  # ── 한국 금리 (한국은행 ECOS, 무료 API 키 필요) ──
  KR_BASE:    {name: 한국 기준금리,   src: ecos, stat: 722Y001, item: "0101000",   kind: rate, session: KR, group: kr_rates}
  KR3Y:       {name: 국고채 3년,      src: ecos, stat: 817Y002, item: "010200000", kind: rate, session: KR, group: kr_rates}
  KR10Y:      {name: 국고채 10년,     src: ecos, stat: 817Y002, item: "010210000", kind: rate, session: KR, group: kr_rates}

  # ── 환율·매크로 (Yahoo Finance) ──
  USDKRW:     {name: 원/달러,     src: yf, id: "KRW=X",    kind: price, session: US, group: fx, digits: 2}
  JPYKRW:     {name: 원/100엔,    src: yf, id: "JPYKRW=X", kind: price, session: US, group: fx, scale: 100, digits: 2}
  DXY:        {name: 달러인덱스,  src: yf, id: "DX-Y.NYB", kind: price, session: US, group: macro, digits: 2}
  USDJPY:     {name: 엔/달러,     src: yf, id: "JPY=X",    kind: price, session: US, group: macro, digits: 2}
  USDCNH:     {name: 위안/달러,   src: yf, id: "CNH=X",    kind: price, session: US, group: macro, digits: 4}
  MOVE:       {name: 채권 변동성(MOVE), src: yf, id: "^MOVE", kind: price, session: US, group: macro, digits: 1}
  GOLD:       {name: 금,          src: yf, id: "GC=F",     kind: price, session: US, group: macro, digits: 1}
  TLT:        {name: 미 장기채 ETF(TLT), src: yf, id: TLT,  kind: price, session: US, group: macro, digits: 2}
  NASDAQ:     {name: 나스닥,      src: yf, id: "^IXIC",    kind: price, session: US, group: macro, digits: 0}
  KOSPI:      {name: 코스피,      src: yf, id: "^KS11",    kind: price, session: KR, group: macro, digits: 2}

  # ── 미국 주식 ──
  QQQ:   {name: 나스닥100 ETF,  src: yf, id: QQQ,  kind: price, session: US, group: stock, digits: 2}
  MSFT:  {name: 마이크로소프트, src: yf, id: MSFT, kind: price, session: US, group: stock, digits: 2}
  SOXX:  {name: 반도체 ETF,     src: yf, id: SOXX, kind: price, session: US, group: stock, digits: 2}
  NVDA:  {name: 엔비디아,       src: yf, id: NVDA, kind: price, session: US, group: stock, digits: 2}
  KBE:   {name: 은행 ETF,       src: yf, id: KBE,  kind: price, session: US, group: stock, digits: 2}
  JPM:   {name: JP모건,         src: yf, id: JPM,  kind: price, session: US, group: stock, digits: 2}
  REM:   {name: 모기지리츠 ETF, src: yf, id: REM,  kind: price, session: US, group: stock, digits: 2}
  AGNC:  {name: AGNC,           src: yf, id: AGNC, kind: price, session: US, group: stock, digits: 2}
  NLY:   {name: 애널리,         src: yf, id: NLY,  kind: price, session: US, group: stock, digits: 2}

  # ── 한국 주식 (티커는 실제 코드 한 번 확인 권장) ──
  K_SW:     {name: TIGER 소프트웨어, src: yf, id: 157490.KS, kind: price, session: KR, group: stock, digits: 0}
  NAVER:    {name: NAVER,            src: yf, id: 035420.KS, kind: price, session: KR, group: stock, digits: 0}
  KAKAO:    {name: 카카오,           src: yf, id: 035720.KS, kind: price, session: KR, group: stock, digits: 0}
  K_SEMI:   {name: KODEX 반도체,     src: yf, id: 091160.KS, kind: price, session: KR, group: stock, digits: 0}
  SEC:      {name: 삼성전자,         src: yf, id: 005930.KS, kind: price, session: KR, group: stock, digits: 0}
  HYNIX:    {name: SK하이닉스,       src: yf, id: 000660.KS, kind: price, session: KR, group: stock, digits: 0}
  K_BANK:   {name: KODEX 은행,       src: yf, id: 091170.KS, kind: price, session: KR, group: stock, digits: 0}
  KB:       {name: KB금융,           src: yf, id: 105560.KS, kind: price, session: KR, group: stock, digits: 0}
  SHINHAN:  {name: 신한지주,         src: yf, id: 055550.KS, kind: price, session: KR, group: stock, digits: 0}
  K_REIT:   {name: TIGER 리츠부동산인프라, src: yf, id: 329200.KS, kind: price, session: KR, group: stock, digits: 0}
  MKIF:     {name: 맥쿼리인프라,     src: yf, id: 088980.KS, kind: price, session: KR, group: stock, digits: 0}
  SLIFE:    {name: 삼성생명,         src: yf, id: 032830.KS, kind: price, session: KR, group: stock, digits: 0}
  K_CONSTR: {name: KODEX 건설,       src: yf, id: 117700.KS, kind: price, session: KR, group: stock, digits: 0}

# 두 금리의 차이(단위 bp). ffill_b: b가 주간/저빈도일 때 앞 값으로 채움
derived:
  US_2S10S:    {name: 미국 장단기차(10Y-2Y),  a: US10Y, b: US2Y}
  KR_3S10S:    {name: 한국 장단기차(10Y-3Y),  a: KR10Y, b: KR3Y}
  USKR_10Y:    {name: 한미 10년 금리차,       a: US10Y, b: KR10Y}
  MORT_SPREAD: {name: 모기지-국채 스프레드,   a: US_MORT30, b: US10Y}

home_tiles: [US_2S10S, USKR_10Y, USDKRW, JPYKRW, DXY, MOVE]

# 커플링/디커플링 후보 (기준: 미국 10년, 국고채 10년)
coupling_candidates:
  US10Y: [US2Y, US30Y, US10Y_REAL, US10Y_BEI, US_MORT30, KR10Y, KR3Y, USDKRW, JPYKRW, DXY, USDJPY, USDCNH, GOLD, TLT, NASDAQ, KOSPI, QQQ, SOXX, KBE, REM, K_BANK, K_SEMI]
  KR10Y: [US10Y, US2Y, KR3Y, USDKRW, JPYKRW, KOSPI, K_BANK, K_SEMI, K_SW, K_REIT, SLIFE, K_CONSTR]

sectors:
  US:
    - {sector: 기술,       etf: QQQ,  stocks: [MSFT]}
    - {sector: 반도체,     etf: SOXX, stocks: [NVDA]}
    - {sector: 은행,       etf: KBE,  stocks: [JPM],        extras: [US_2S10S]}
    - {sector: 모기지 리츠, etf: REM,  stocks: [AGNC, NLY], extras: [MOVE, MORT_SPREAD]}
  KR:
    - {sector: 기술,       etf: K_SW,   stocks: [NAVER, KAKAO]}
    - {sector: 반도체,     etf: K_SEMI, stocks: [SEC, HYNIX]}
    - {sector: 은행,       etf: K_BANK, stocks: [KB, SHINHAN], extras: [KR_3S10S]}
    - {sector: 리츠·인프라(모기지 대체), etf: K_REIT, stocks: [MKIF], extras: [KR10Y]}

# 국장에서 금리와 직접 연결되는 종목 2개 (방향이 반대인 두 개)
kr_rate_stocks:
  - {key: SLIFE,    note: 금리 상승 시 운용수익 개선 기대 쪽}
  - {key: K_CONSTR, note: 금리 하락 시 조달·PF 부담 완화 쪽}

# 뉴스 검색어 (Google News RSS)
news:
  rates_fx:
    ko: [미국 국채금리, 국고채 금리, 원달러 환율, 엔화 환율, 한국은행 기준금리, FOMC]
    en: [Treasury yields, Federal Reserve rate, Bank of Japan yen]
  stocks:
    ko: [반도체주, 은행주, 기술주 나스닥, 코스피 외국인, 리츠 배당]
    en: [semiconductor stocks, bank stocks yields, mortgage REIT AGNC]
  max_per_group: 25
  max_age_hours: 48

# 알림 기준 (텔레그램)
alerts:
  US10Y_bp: 10
  KR10Y_bp: 8
  USDKRW_pct: 1.0
  JPYKRW_pct: 1.5
  decoupling: true

# 일정: 자동 수집이 어려워 직접 관리합니다. 날짜는 공식 일정으로 꼭 확인하세요.
calendar:
  - {date: 2026-10-28, title: FOMC 결과 발표 (확인 필요)}
  - {date: 2026-12-09, title: FOMC 결과 발표 (확인 필요)}
